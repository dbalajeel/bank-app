#Server Settings
spring.application.name=backend

#Database
#converts json to database 
spring.datasource.url=jdbc:sqlite:bankey.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# one writer at a time. 1 connection. hikari = connection pool. 
spring.datasource.hikari.maximum-pool-size=1

# Teach Hibernate to speak SQLite's style of SQL
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Create/update tables automatically from our Java classes
#hibernate is a translator between java and database
spring.jpa.hibernate.ddl-auto=update

# Print the SQL in the console 
spring.jpa.show-sql=true

# JWT settings: 
#JWT_SECRET = take the secret from environment variable 
jwt.secret=${JWT_SECRET}
#tokens expire after 30 min
jwt.expiration-minutes=30

# Show our error messages 
spring.web.error.include-message=always