spring.application.name=backend
# Database: a SQLite file called bankey.db inside the backend folder
spring.datasource.url=jdbc:sqlite:bankey.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite allows only one writer at a time, so use one connection
spring.datasource.hikari.maximum-pool-size=1

# Teach Hibernate to speak SQLite's style of SQL
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Create/update tables automatically from our Java classes
spring.jpa.hibernate.ddl-auto=update

# Print the SQL in the console so we can learn what happens
spring.jpa.show-sql=true
# JWT settings: the secret comes from the environment, never from this file
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=30